<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Tracker</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f4fa;--surface:#ffffff;--ink:#16213e;--muted:#5d6785;--line:#dde3f0;
  --accent:#3b5bdb;--accent-ink:#ffffff;--ok:#12805c;--ok-bg:#dff5ec;--bad:#c2410c;--bad-bg:#fde8dc;--track:#e6eaf4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1526;--surface:#182038;--ink:#e8ecf8;--muted:#9aa5c6;--line:#2a3558;
  --accent:#7c93f5;--accent-ink:#0f1526;--ok:#4cd6a0;--ok-bg:#12372d;--bad:#ff9a62;--bad-bg:#3d2417;--track:#263150;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1526;--surface:#182038;--ink:#e8ecf8;--muted:#9aa5c6;--line:#2a3558;
  --accent:#7c93f5;--accent-ink:#0f1526;--ok:#4cd6a0;--ok-bg:#12372d;--bad:#ff9a62;--bad-bg:#3d2417;--track:#263150;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:1.9rem;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted);max-width:46ch}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
button:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.target{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.target label{font-weight:600}
.target input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.target output{font-size:1.5rem;font-weight:700;min-width:3.2ch;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
.add{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}
.add label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.add input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.err{color:var(--bad);min-height:1.4em;margin:8px 0 0;font-size:.9rem}
@media(max-width:600px){.add{grid-template-columns:1fr 1fr}.add .name{grid-column:1/-1}.add button{grid-column:1/-1}}
.subject{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.row h3{margin:0;font-size:1.1rem}
.pct{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.bar{position:relative;height:12px;background:var(--track);border-radius:99px;margin:12px 0 6px;overflow:visible}
.fill{height:100%;border-radius:99px;transition:width .35s}
.fill.ok{background:var(--ok)}.fill.bad{background:var(--bad)}
.tick{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;flex-wrap:wrap;gap:6px}
.verdict{display:inline-block;margin-top:10px;padding:5px 11px;border-radius:99px;font-weight:600;font-size:.92rem}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{font-size:.88rem;padding:6px 10px}
.actions .del{margin-left:auto;color:var(--muted)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty p{margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.tools{display:flex;gap:8px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Attendance tracker</h1>
      <p class="sub">Track every subject, see how many classes you need to attend to reach your target, and how many you can safely skip.</p>
    </div>
    <div class="tools">
      <button id="copy">Copy report</button>
      <button id="theme" aria-label="Toggle dark mode">Dark mode</button>
    </div>
  </header>

  <section class="panel target">
    <label for="target">Required attendance</label>
    <input id="target" type="range" min="50" max="95" step="1" value="80">
    <output id="targetOut" for="target">80%</output>
  </section>

  <section class="stats" id="stats" aria-live="polite"></section>

  <section class="panel">
    <div class="add">
      <div class="name"><label for="name">Subject</label><input id="name" maxlength="40" placeholder="e.g. Data Structures" autocomplete="off"></div>
      <div><label for="total">Total classes</label><input id="total" type="number" min="1" inputmode="numeric" placeholder="40"></div>
      <div><label for="att">Attended</label><input id="att" type="number" min="0" inputmode="numeric" placeholder="28"></div>
      <button class="primary" id="addBtn">Add subject</button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section id="list"></section>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY = "attendance-tracker-v1";
  var state = { target: 80, subjects: [] };
  var $ = function(id){ return document.getElementById(id); };

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.subjects)) { state.subjects = s.subjects; state.target = +s.target || 80; }
      }
    } catch (e) {}
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  // Core maths: classes to attend (all future classes attended) and classes that can be skipped.
  function calc(total, att, target){
    var t = target / 100;
    var pct = total ? (att / total) * 100 : 0;
    if (pct >= target) {
      var skip = Math.max(0, Math.floor(att / t - total + 1e-9));
      return { pct: pct, ok: true, need: 0, skip: skip };
    }
    var need = Math.max(0, Math.ceil((t * total - att) / (1 - t) - 1e-9));
    return { pct: pct, ok: false, need: need, skip: 0 };
  }

  function plural(n, w){ return n + " " + w + (n === 1 ? "" : "es"); }

  function render(){
    $("target").value = state.target;
    $("targetOut").textContent = state.target + "%";

    var tot = 0, att = 0, safe = 0, risk = 0;
    state.subjects.forEach(function(s){
      tot += s.total; att += s.att;
      calc(s.total, s.att, state.target).ok ? safe++ : risk++;
    });
    var overall = tot ? (att / tot) * 100 : 0;
    $("stats").innerHTML =
      '<div class="stat"><b>' + overall.toFixed(1) + '%</b><span>Overall attendance</span></div>' +
      '<div class="stat"><b>' + safe + '</b><span>Subjects on track</span></div>' +
      '<div class="stat"><b>' + risk + '</b><span>Subjects below target</span></div>' +
      '<div class="stat"><b>' + tot + '</b><span>Classes held in total</span></div>';

    if (!state.subjects.length) {
      $("list").innerHTML = '<div class="panel empty"><p>No subjects yet. Add one above, or load sample data to see how it works.</p><button class="primary" id="demo">Load sample data</button></div>';
      return;
    }
    $("list").innerHTML = state.subjects.map(function(s, i){
      var r = calc(s.total, s.att, state.target);
      var cls = r.ok ? "ok" : "bad";
      var verdict = r.ok
        ? (r.skip > 0 ? "On track. You can skip " + plural(r.skip, "class") + "." : "On track. Don’t skip the next class.")
        : "Attend the next " + plural(r.need, "class") + " to reach " + state.target + "%.";
      return '<article class="subject">' +
        '<div class="row"><h3>' + esc(s.name) + '</h3><span class="pct">' + r.pct.toFixed(1) + '%</span></div>' +
        '<div class="bar" role="img" aria-label="' + esc(s.name) + ' attendance ' + r.pct.toFixed(1) + ' percent, target ' + state.target + ' percent">' +
          '<div class="fill ' + cls + '" style="width:' + Math.min(100, r.pct) + '%"></div>' +
          '<div class="tick" style="left:calc(' + state.target + '% - 1px)" title="Target ' + state.target + '%"></div></div>' +
        '<div class="meta"><span>' + s.att + ' attended of ' + s.total + ' classes</span><span>Target ' + state.target + '%</span></div>' +
        '<span class="verdict ' + cls + '">' + verdict + '</span>' +
        '<div class="actions">' +
          '<button data-a="present" data-i="' + i + '">+ Attended a class</button>' +
          '<button data-a="absent" data-i="' + i + '">+ Missed a class</button>' +
          '<button data-a="undo" data-i="' + i + '">Undo last</button>' +
          '<button class="del" data-a="del" data-i="' + i + '">Delete</button>' +
        '</div></article>';
    }).join("");
  }

  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function addSubject(){
    var name = $("name").value.trim();
    var total = parseInt($("total").value, 10);
    var att = parseInt($("att").value, 10);
    var err = "";
    if (!/[a-zA-Z]/.test(name)) err = "Enter a subject name that contains letters.";
    else if (!(total >= 1)) err = "Total classes must be a whole number of at least 1.";
    else if (!(att >= 0)) err = "Attended classes must be a whole number, 0 or more.";
    else if (att > total) err = "Attended classes can’t be more than total classes.";
    else if (state.subjects.some(function(s){ return s.name.toLowerCase() === name.toLowerCase(); })) err = "That subject is already in your list.";
    $("err").textContent = err;
    if (err) return;
    state.subjects.push({ name: name, total: total, att: att, hist: [] });
    $("name").value = ""; $("total").value = ""; $("att").value = "";
    $("name").focus();
    save(); render();
  }

  $("addBtn").addEventListener("click", addSubject);
  ["name","total","att"].forEach(function(id){
    $(id).addEventListener("keydown", function(e){ if (e.key === "Enter") addSubject(); });
  });

  $("target").addEventListener("input", function(){ state.target = +this.value; save(); render(); });

  $("list").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.id === "demo") {
      state.subjects = [
        { name: "Data Structures", total: 40, att: 34, hist: [] },
        { name: "Operating Systems", total: 36, att: 24, hist: [] },
        { name: "Database Systems", total: 30, att: 23, hist: [] },
        { name: "Engineering Maths", total: 44, att: 31, hist: [] }
      ];
      save(); render(); return;
    }
    var s = state.subjects[+b.dataset.i]; if (!s) return;
    var a = b.dataset.a;
    if (a === "present") { s.total++; s.att++; s.hist = (s.hist || []).concat("p"); }
    else if (a === "absent") { s.total++; s.hist = (s.hist || []).concat("a"); }
    else if (a === "undo") {
      var h = s.hist || [];
      if (!h.length) { toast("Nothing to undo"); return; }
      var last = h[h.length - 1]; s.hist = h.slice(0, -1);
      s.total--; if (last === "p") s.att--;
    }
    else if (a === "del") {
      if (!confirm("Delete " + s.name + "?")) return;
      state.subjects.splice(+b.dataset.i, 1);
    }
    save(); render();
  });

  $("copy").addEventListener("click", function(){
    if (!state.subjects.length) { toast("Add a subject first"); return; }
    var lines = ["Attendance report (target " + state.target + "%)"];
    state.subjects.forEach(function(s){
      var r = calc(s.total, s.att, state.target);
      lines.push(s.name + ": " + s.att + "/" + s.total + " = " + r.pct.toFixed(1) + "% - " +
        (r.ok ? "can skip " + r.skip : "attend next " + r.need));
    });
    var text = lines.join("\n");
    var done = function(){ toast("Report copied"); };
    var fail = function(){ window.prompt("Copy your report:", text); };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  });

  $("theme").addEventListener("click", function(){
    var root = document.documentElement;
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
    $("theme").textContent = dark ? "Dark mode" : "Light mode";
  });

  load(); render();
})();
</script>
</body>
</html>
